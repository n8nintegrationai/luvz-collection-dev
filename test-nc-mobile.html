<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NC Mobile Test</title>
  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: monospace; font-size: 12px; }
    .test { padding: 20px; margin: 10px; background: #222; border: 1px solid #333; }
    .pass { color: #0f0; }
    .fail { color: #f00; }
    .result { margin: 5px 0; }
    iframe { width: 375px; height: 100vh; border: 2px solid #666; margin: 20px; }
  </style>
</head>
<body>
  <div class="test">
    <h2>NC Mobile Layout Test (375px viewport)</h2>
    <p>Testing at mobile width...</p>
    <iframe id="preview" src="http://localhost:8000/public/index.html"></iframe>
  </div>

  <script>
    const preview = document.getElementById('preview');

    // After iframe loads, test the layout
    preview.addEventListener('load', () => {
      try {
        const doc = preview.contentDocument;
        const tests = [];

        // Test 1: Check SVG display property
        const svg = doc.getElementById('nc-angle-dots');
        const svgDisplay = doc.defaultView.getComputedStyle(svg).display;
        tests.push({
          name: '#nc-angle-dots display',
          expected: 'block',
          actual: svgDisplay,
          pass: svgDisplay === 'block'
        });

        // Test 2: Check if SVG is in DOM
        tests.push({
          name: '#nc-angle-dots in DOM',
          expected: 'exists',
          actual: svg ? 'exists' : 'missing',
          pass: !!svg
        });

        // Test 3: Check caption display
        const caption = doc.getElementById('nc-caption');
        tests.push({
          name: '#nc-caption exists',
          expected: 'true',
          actual: caption ? 'true' : 'false',
          pass: !!caption
        });

        // Test 4: Check price display
        const price = doc.getElementById('nc-cap-price');
        const priceDisplay = price ? doc.defaultView.getComputedStyle(price).display : 'element not found';
        tests.push({
          name: '#nc-cap-price display',
          expected: 'block',
          actual: priceDisplay,
          pass: priceDisplay === 'block'
        });

        // Test 5: Check enquire display
        const enquire = doc.getElementById('nc-cap-enquire');
        const enquireDisplay = enquire ? doc.defaultView.getComputedStyle(enquire).display : 'element not found';
        tests.push({
          name: '#nc-cap-enquire display',
          expected: 'inline-block',
          actual: enquireDisplay,
          pass: enquireDisplay === 'inline-block'
        });

        // Test 6: Check filmstrip display
        const filmstrip = doc.getElementById('nc-filmstrip');
        const filmstripDisplay = filmstrip ? doc.defaultView.getComputedStyle(filmstrip).display : 'element not found';
        tests.push({
          name: '#nc-filmstrip display',
          expected: 'flex',
          actual: filmstripDisplay,
          pass: filmstripDisplay === 'flex'
        });

        // Print results
        const testDiv = document.createElement('div');
        testDiv.className = 'test';
        testDiv.innerHTML = '<h3>Results:</h3>';
        tests.forEach(t => {
          const resultEl = document.createElement('div');
          resultEl.className = `result ${t.pass ? 'pass' : 'fail'}`;
          resultEl.innerHTML = `${t.pass ? '✓' : '✗'} ${t.name}: ${t.actual} (expected: ${t.expected})`;
          testDiv.appendChild(resultEl);
        });
        document.body.appendChild(testDiv);

        console.log('Tests:', tests);
      } catch (e) {
        console.error('Test error:', e);
      }
    }, false);

    // Fallback if iframe fails to load
    setTimeout(() => {
      if (!preview.contentDocument) {
        document.body.innerHTML += '<div class="test fail">Failed to load iframe - is server running on port 8000?</div>';
      }
    }, 3000);
  </script>
</body>
</html>
